[project]
name = "hispanshield-edge"
version = "0.1.0"
description = "HISPANSHIELD edge gateway agent: durable store-and-forward telemetry for isolated sites"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.28,<0.29"]

[project.scripts]
hispanshield-edge = "hispanshield_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hispanshield_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S"]
ignore = ["S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]
