[project]
name = "hispanshield"
version = "0.1.3"
description = "HISPANSHIELD — Enterprise & Government AI-Driven Cyber Defence Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.34.2",
  "starlette==1.10.0",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "alembic==1.15.2",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "email-validator==2.2.0",
  "argon2-cffi==25.1.0",
  "pyotp==2.9.0",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "PyYAML==6.0.2",
  # Hardened XML parser for untrusted Nessus/OpenVAS reports (XXE/entity
  # expansion). Small, audited dependency; security justification in ADR-014.
  "defusedxml==0.7.1",
  "python-multipart==0.0.31",
  "numpy==2.2.6",
  "Jinja2==3.1.6",
  "python-dateutil==2.9.0.post0",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==6.1.1",
  "ruff==0.11.10",
  "mypy==1.15.0",
  "bandit==1.8.3",
  "pip-audit==2.9.0",
  "pyproject-api==1.9.0",
  "types-PyYAML==6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires PostgreSQL",
  "security: security regression suites",
  "slow: slower integration scenarios",
]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S", "ASYNC"]
ignore = ["S101", "B008", "S105", "S106", "S311", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]
"app/seed.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["migrations/", "tests/"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "migrations/*"]
